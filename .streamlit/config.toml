[theme]
base = "dark"
primaryColor = "#56ddc0"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#142238"
textColor = "#e8edf6"
font = "sans serif"
[server]
headless = true
address = "0.0.0.0"
port = 8501

[browser]
gatherUsageStats = false

[runner]
# All user-facing content is rendered explicitly. Never print UI return objects.
magicEnabled = false
